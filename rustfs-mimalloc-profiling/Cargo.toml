[package]
name = "rustfs-mimalloc-profiling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "Sampled allocation and live heap profiles for mimalloc"
documentation = "https://docs.rs/rustfs-mimalloc-profiling"
readme = "README.md"
keywords = ["mimalloc", "profiling", "pprof", "heap", "allocator"]
categories = ["memory-management", "development-tools::profiling"]

[features]
default = []
rustfs-allocator = ["dep:rustfs-mimalloc"]

[dependencies]
rustfs-mimalloc = { workspace = true, optional = true }
backtrace.workspace = true
libc.workspace = true
log.workspace = true
prost.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "ios"))'.dependencies]
findshlibs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
object = { workspace = true, features = ["read_core", "elf", "std"] }

[dev-dependencies]
libflate.workspace = true

[[example]]
name = "mimalloc_baseline"
required-features = ["rustfs-allocator"]

[[example]]
name = "mimalloc_overhead"
required-features = ["rustfs-allocator"]
