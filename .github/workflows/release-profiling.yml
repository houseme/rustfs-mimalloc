name: Release profiling crate

on:
  push:
    tags:
      - 'profiling-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Stable profiling crate version
        required: true
        type: string
      dry_run:
        description: Verify publication without uploading or creating a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: profiling-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the independently versioned profiling package
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          version = os.environ['REQUESTED_VERSION']
          if os.environ['RELEASE_EVENT'] == 'push':
              ref = os.environ['RELEASE_REF']
              if not ref.startswith('profiling-v'):
                  raise SystemExit('expected a profiling-v<VERSION> tag')
              version = ref.removeprefix('profiling-v')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('expected a stable semantic version')
          metadata = json.loads(subprocess.check_output(
              ['cargo', 'metadata', '--no-deps', '--locked', '--format-version', '1'], text=True))
          package = next(p for p in metadata['packages'] if p['name'] == 'rustfs-mimalloc-profiling')
          if package['version'] != version:
              raise SystemExit(f"profiling version mismatch: {package['version']} != {version}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={version}\ntag=profiling-v{version}\ndry_run={os.environ['RELEASE_DRY_RUN']}\n")
          print(f'Validated rustfs-mimalloc-profiling {version}')
          PY

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: 1.96.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test the workspace allocator integration
        run: cargo test --locked -p rustfs-mimalloc-profiling
      - name: Test the normalized archive with registry dependencies
        run: python3 scripts/verify_profiling_package.py

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --locked -p rustfs-mimalloc-profiling --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  publish:
    needs: [prepare, test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo publication
        if: needs.prepare.outputs.dry_run == 'true'
        run: cargo publish --locked --registry crates-io -p rustfs-mimalloc-profiling --dry-run
      - name: Publish only rustfs-mimalloc-profiling
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io -p rustfs-mimalloc-profiling
      - name: Verify the official index and uploaded archive
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/verify_profiling_registry.py "$RELEASE_VERSION" --archive "target/package/rustfs-mimalloc-profiling-$RELEASE_VERSION.crate"
      - name: Create the profiling GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "rustfs-mimalloc-profiling $RELEASE_VERSION" --notes-file rustfs-mimalloc-profiling/CHANGELOG.md --latest=false
