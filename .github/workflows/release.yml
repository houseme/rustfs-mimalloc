name: Release

on:
  # Trigger on version tags: v0.1.0, v1.2.3, etc.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # Manual dispatch with version input
  workflow_dispatch:
    inputs:
      version:
        description: "Workspace version to validate or publish (e.g. 0.6.1)."
        required: true
        type: string
      dry_run:
        description: "Dry run — skip crates.io publish and GitHub release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: workspace-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  # The sampler is process-global; concurrency contracts spawn their own workers.
  RUST_TEST_THREADS: 1

jobs:
  # ── Resolve version ────────────────────────────────────────────────────────

  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_dry_run: ${{ steps.version.outputs.is_dry_run }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/v{0}', inputs.version) || github.sha }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - name: Record release revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: cargo xtask release-resolve

      - name: Verify version consistency
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask release-check "$EXPECTED_VERSION"

  # ── Full test gate ─────────────────────────────────────────────────────────

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: 1.95.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Test Rust maintenance tool contracts
        run: cargo test --locked -p xtask
      - name: Build (default)
        run: cargo build --locked

      - name: Test (default)
        run: cargo test --locked

      - name: Build (secure)
        run: cargo build --locked --features secure

      - name: Test (secure)
        run: cargo test --locked --features secure

      - name: Build (stable feature set)
        run: cargo build --locked --features secure,debug

      - name: Test (stable feature set)
        run: cargo test --locked --features secure,debug

      - name: Test (no allocation profiling)
        run: cargo test --locked --workspace --features no_profile

      - name: Test (secure debug without allocation profiling)
        run: cargo test --locked --workspace --features secure,debug,no_profile

      - name: Test isolated provider contracts
        run: cargo xtask test-providers --local-dependencies
      - name: Test optional RustFS convenience API
        run: cargo test --locked -p rustfs-mimalloc-profiling --features rustfs-allocator --test compatibility

      - name: Verify sys archive
        run: cargo package --locked -p rustfs-mimalloc-sys
      - name: Verify allocator archive before sys publication
        run: cargo package --locked -p rustfs-mimalloc --config 'patch.crates-io.rustfs-mimalloc-sys.path="rustfs-mimalloc-sys"'
      - name: Test normalized profiling archive before dependency publication
        run: cargo xtask verify-package --local-dependencies

  # ── Lint gate ──────────────────────────────────────────────────────────────

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Public API and ABI controls
        run: |
          cargo xtask check-api
          cargo xtask check-abi
          cargo xtask test-abi

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ── Publish to crates.io ──────────────────────────────────────────────────

  publish:
    name: Publish to crates.io
    needs: [ prepare, test, lint ]
    if: needs.prepare.outputs.is_dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish and verify all three crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for package in rustfs-mimalloc-sys rustfs-mimalloc rustfs-mimalloc-profiling; do
            cargo package --locked --registry crates-io --package "$package" --allow-dirty
            archive="$RUNNER_TEMP/$package-$RELEASE_VERSION.crate"
            cp "target/package/$package-$RELEASE_VERSION.crate" "$archive"
            if ! cargo publish --locked --registry crates-io --package "$package" --allow-dirty; then
              echo "Upload did not complete; checking for an identical published package."
            fi
            cargo xtask verify-registry "$package" "$RELEASE_VERSION" --archive "$archive"
          done
      - name: Test normalized profiling archive with published dependencies
        run: cargo xtask verify-package --allow-dirty

  # ── GitHub Release ─────────────────────────────────────────────────────────

  github-release:
    name: GitHub Release
    needs: [ prepare, publish ]
    if: needs.prepare.outputs.is_dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.revision }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
      - name: Generate changelog
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cargo xtask release-notes "$RELEASE_VERSION" --output /tmp/release-notes.md
          cat /tmp/release-notes.md

      - name: Validate release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          test -s /tmp/release-notes.md
          grep -F "## rustfs-mimalloc v${RELEASE_VERSION}" /tmp/release-notes.md
          grep -F "mimalloc V3 (v" /tmp/release-notes.md

          if [ "${RELEASE_VERSION}" != "0.1.0" ] && grep -Fxq "Initial release." /tmp/release-notes.md; then
            echo "::error::Non-initial releases must not publish placeholder release notes."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: v${{ needs.prepare.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          generate_release_notes: false

  # ── Dry run summary ────────────────────────────────────────────────────────

  dry-run-summary:
    name: Dry Run Summary
    needs: [ prepare, test, lint ]
    if: needs.prepare.outputs.is_dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Summary
        run: |
          {
            echo "## 🏷️ Dry Run Complete"
            echo ""
            echo "- **Version**: \`${{ needs.prepare.outputs.version }}\`"
            echo "- **Tag**: \`${{ needs.prepare.outputs.tag }}\`"
            echo "- Tests: ✅ passed"
            echo "- Lint: ✅ passed"
            echo ""
            echo "To publish for real, re-run with **dry_run** unchecked."
          } >> "$GITHUB_STEP_SUMMARY"
