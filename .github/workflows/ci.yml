name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Daily catch-up with Rust toolchain regressions
  schedule:
    - cron: "17 03 * * *"

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ── Build & Test ─────────────────────────────────────────────────────────────

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        features:
          - ""
          - "secure"
        include:
          # debug feature — test on all platforms
          - os: ubuntu-latest
            features: "debug"
          - os: macos-latest
            features: "debug"
          - os: windows-latest
            features: "debug"
          # override — non-Windows only (requires dylib interposing)
          - os: ubuntu-latest
            features: "override"
          - os: macos-latest
            features: "override"
          # stable feature set (non-Windows)
          - os: ubuntu-latest
            features: "secure,debug,override"
          - os: macos-latest
            features: "secure,debug,override"
          # stable feature set (Windows — no override)
          - os: windows-latest
            features: "secure,debug"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --features "${{ matrix.features }}"

      - name: Test
        run: cargo test --features "${{ matrix.features }}"

      - name: Test doc-tests
        run: cargo test --doc --features "${{ matrix.features }}"

  # ── Cross-compilation (musl) ───────────────────────────────────────────────

  cross-musl:
    name: Cross (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (musl, static)
        run: cargo build --target x86_64-unknown-linux-musl --features secure

  # ── Windows static CRT ────────────────────────────────────────────────────

  windows-static-crt:
    name: Windows static CRT
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (static CRT)
        run: cargo build --features secure

      - name: Test (static CRT)
        run: cargo test --features secure

  # ── MSRV check ─────────────────────────────────────────────────────────────

  msrv:
    name: MSRV (1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  # ── Lint: fmt + clippy ────────────────────────────────────────────────────

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (default)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (stable feature set)
        run: cargo clippy --workspace --features secure,debug -- -D warnings

  # ── Documentation ──────────────────────────────────────────────────────────

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly

      - name: Check doc links (rustfs-mimalloc)
        run: cargo rustdoc -p rustfs-mimalloc -- -D warnings

      - name: Check doc links (rustfs-mimalloc-sys)
        run: cargo rustdoc -p rustfs-mimalloc-sys -- -D warnings

  # ── Bench (compile-only, no execution) ─────────────────────────────────────

  bench:
    name: Bench (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build benchmarks
        run: cargo bench --no-run
