name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Daily catch-up with Rust toolchain regressions
  schedule:
    - cron: "17 03 * * *"

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ── Build & Test ─────────────────────────────────────────────────────────────

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        features:
          - ""
          - "secure"
          - "no_profile"
          - "secure,debug,no_profile"
        include:
          # debug feature — test on all platforms
          - os: ubuntu-latest
            features: "debug"
          - os: macos-latest
            features: "debug"
          - os: windows-latest
            features: "debug"
          # override — non-Windows only (requires dylib interposing)
          - os: ubuntu-latest
            features: "override"
          - os: macos-latest
            features: "override"
          # Exercise the actual runtime defaults and TLS build configuration.
          - os: ubuntu-latest
            features: "no_thp,local_dynamic_tls"
          - os: macos-latest
            features: "local_dynamic_tls"
          # stable feature set (non-Windows)
          - os: ubuntu-latest
            features: "secure,debug,override"
          - os: macos-latest
            features: "secure,debug,override"
          - os: ubuntu-latest
            features: "secure,debug,override,no_profile"
          - os: macos-latest
            features: "secure,debug,override,no_profile"
          # stable feature set (Windows — no override)
          - os: windows-latest
            features: "secure,debug"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --features "${{ matrix.features }}"

      - name: Test
        run: cargo test --features "${{ matrix.features }}"

      - name: Test doc-tests
        run: cargo test --doc --features "${{ matrix.features }}"

  # ── Cross-compilation (musl) ───────────────────────────────────────────────

  cross-musl:
    name: Cross (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (musl, static)
        run: cargo build --target x86_64-unknown-linux-musl --features secure

      - name: Build (musl, static, no profiling)
        run: cargo build --target x86_64-unknown-linux-musl --features secure,no_profile

  # ── Windows static CRT ────────────────────────────────────────────────────

  windows-static-crt:
    name: Windows static CRT (${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        features: ["", "secure", "secure,debug", "secure,debug,no_profile"]
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      CC_ENABLE_DEBUG_OUTPUT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (static CRT)
        run: cargo build --verbose --features "${{ matrix.features }}"

      - name: Test startup before libtest (static CRT)
        run: cargo test -p rustfs-mimalloc --test startup --features "${{ matrix.features }}"

      - name: Test (static CRT)
        run: cargo test --verbose --workspace --features "${{ matrix.features }}" -- --nocapture

      - name: Test startup (release, static CRT)
        run: cargo test -p rustfs-mimalloc --release --test startup --features "${{ matrix.features }}"

      - name: Diagnose native startup crash
        if: failure()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $debugger = Join-Path $env:RUNNER_TEMP 'startup-debug.exe'
          $nativeControl = Join-Path $env:RUNNER_TEMP 'native-crt-control.exe'
          $buildCmd = Join-Path $env:RUNNER_TEMP 'build-startup-debug.cmd'
          @"
          @echo off
          call "$devcmd" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /W4 /Zi "$PWD\scripts\windows-startup-debug.c" /Fe:"$debugger" /link dbghelp.lib
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /W4 /MT /Zi "$PWD\scripts\windows-crt-control.c" /Fe:"$nativeControl"
          exit /b %errorlevel%
          "@ | Set-Content -Encoding ASCII $buildCmd
          & cmd /d /c $buildCmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Native C /MT baseline (no Rust or mimalloc):'
          & $debugger $nativeControl
          Write-Output "Native C baseline exit: $LASTEXITCODE"
          $rustControl = Join-Path $env:RUNNER_TEMP 'rust-crt-control.exe'
          rustc --edition=2024 -g -C target-feature=+crt-static scripts\windows-crt-control.rs -o $rustControl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Rust static CRT baseline (System allocator, no mimalloc):'
          & $debugger $rustControl
          Write-Output "Rust System baseline exit: $LASTEXITCODE"
          $map = Join-Path $env:RUNNER_TEMP 'startup.map'
          cargo rustc -p rustfs-mimalloc --test startup --features "${{ matrix.features }}" -- -C "link-arg=/MAP:$map"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Get-ChildItem target\debug\deps\startup-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $test) { throw 'Startup test executable was not built' }
          $trace = & $debugger $test.FullName | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'startup-stack.txt')
          $debugExit = $LASTEXITCODE
          Write-Output $trace
          $mapLines = Get-Content $map
          $preferredLine = $mapLines | Where-Object { $_ -match 'Preferred load address is\s+([0-9a-fA-F]+)' } | Select-Object -First 1
          $preferredBase = [Convert]::ToUInt64(($preferredLine -split '\s+')[-1], 16)
          $symbols = $mapLines | ForEach-Object {
            if ($_ -match '^\s*[0-9a-fA-F]{4}:[0-9a-fA-F]+\s+(\S+)\s+([0-9a-fA-F]{16})') {
              [PSCustomObject]@{Name = $Matches[1]; Address = [Convert]::ToUInt64($Matches[2], 16)}
            }
          }
          foreach ($frame in $trace) {
            if ($frame -match '(?:AV_RVA=|RVA=)([0-9a-fA-F]+)') {
              $address = $preferredBase + [Convert]::ToUInt64($Matches[1], 16)
              $nearest = $symbols | Where-Object Address -LE $address | Sort-Object Address | Select-Object -Last 3
              Write-Output "MAP symbols for $frame"
              $nearest | ForEach-Object { '{0}+0x{1:x}' -f $_.Name, ($address - $_.Address) }
            }
          }
          exit $debugExit

  # ── clang-cl C atomics / ABI compatibility ─────────────────────────────────

  windows-clang-cl:
    name: Windows clang-cl (C11 atomics)
    runs-on: windows-latest
    env:
      CC: clang-cl
      CFLAGS: /std:c11
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Check compiler availability
        run: clang-cl --version

      - name: Test (clang-cl)
        run: cargo test --workspace --features secure,debug

      - name: Test (clang-cl, no profiling)
        run: cargo test --workspace --features secure,debug,no_profile

  # ── Older toolchain compatibility (no declared Cargo MSRV) ─────────────────

  compatibility:
    name: Rust 1.96.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

  # ── Lint: fmt + clippy ────────────────────────────────────────────────────

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (default)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (stable feature set)
        run: cargo clippy --workspace --features secure,debug -- -D warnings

  # ── Documentation ──────────────────────────────────────────────────────────

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@nightly

      - name: Check doc links (rustfs-mimalloc)
        run: cargo rustdoc -p rustfs-mimalloc -- -D warnings

      - name: Check doc links (rustfs-mimalloc-sys)
        run: cargo rustdoc -p rustfs-mimalloc-sys -- -D warnings

  # ── Bench (compile-only, no execution) ─────────────────────────────────────

  bench:
    name: Bench (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build benchmarks
        run: cargo bench --no-run
