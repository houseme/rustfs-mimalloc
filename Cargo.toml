[workspace]
members = ["rustfs-mimalloc-sys", "rustfs-mimalloc", "rustfs-mimalloc-profiling"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://houseme.github.io/rustfs-mimalloc"
repository = "https://github.com/houseme/rustfs-mimalloc"
authors = ["houseme <housemecn@gmail.com>"]
description = "High-performance mimalloc V3 bindings for Rust"
keywords = ["allocator", "mimalloc", "memory"]
categories = ["memory-management", "no-std"]

[workspace.dependencies]
rustfs-mimalloc = { path = "rustfs-mimalloc", version = "0.7.0" }
rustfs-mimalloc-sys = { path = "rustfs-mimalloc-sys", version = "0.7.0" }

backtrace = "0.3"
cc = "1.8.0"
criterion = "0.8.2"
findshlibs = "0.10"
libc = "0.2"
libflate = "2.3"
mimalloc = "0.1.52"
log = "0.4"
object = "0.40"
prost = "0.14"
# Keep the transitive decoder above the RUSTSEC-2026-0344 vulnerable range.
ruzstd = "0.9.1"
