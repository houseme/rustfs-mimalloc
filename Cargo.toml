[workspace]
members = ["rustfs-mimalloc-sys", "rustfs-mimalloc"]
resolver = "3"

[workspace.package]
version = "0.5.6"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
homepage = "https://houseme.github.io/rustfs-mimalloc"
repository = "https://github.com/houseme/rustfs-mimalloc"
authors = ["houseme <housemecn@gmail.com>"]
description = "High-performance mimalloc V3 bindings for Rust"
keywords = ["allocator", "mimalloc", "memory"]
categories = ["memory-management", "no-std"]

[workspace.dependencies]
rustfs-mimalloc = { path = "rustfs-mimalloc", version = "0.5.6" }
rustfs-mimalloc-sys = { path = "rustfs-mimalloc-sys", version = "0.5.6" }
cc = "1.5.1"
